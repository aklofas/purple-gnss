[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrx"
version = "0.1.0"
description = "Offline GNSS receiver in Python: acquisition through RTK on recorded samples"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = ["numpy", "scipy", "matplotlib", "georinex", "hatanaka", "pymap3d"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pyrx-acq = "pyrx.cli:acq_main"
pyrx-trk = "pyrx.cli:trk_main"
pyrx-nav = "pyrx.cli:nav_main"
pyrx-rinex = "pyrx.cli:rinex_main"
pyrx-pvt = "pyrx.cli:pvt_main"
pyrx-rtk = "pyrx.cli:rtk_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "FURB", "PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]
