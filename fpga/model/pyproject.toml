[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fpgamodel"
version = "0.1.0"
description = "Bit-true Python model of the FPGA tracking channel, the reference for its cocotb bench"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = ["numpy", "pyrx"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "cocotb>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
